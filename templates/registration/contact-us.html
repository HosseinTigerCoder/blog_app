<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>تماس با ما</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #f9fafb, #eef1f6);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Vazirmatn", sans-serif;
    }
    .contact-card {
      background: #fff;
      padding: 2.5rem;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 600px;
    }
    .form-control:focus {
      box-shadow: 0 0 0 0.25rem rgba(13,110,253,.25);
    }
  </style>
</head>
<body>

  <div class="contact-card">
    <h2 class="text-center mb-4 text-primary fw-bold">تماس با ما</h2>
    <p class="text-center text-muted mb-4">نظرات، پیشنهادات یا سوالات خود را برای ما ارسال کنید. با افتخار پاسخگو خواهیم بود 💬</p>

    <form method="post" action="{% url 'contact_us' %}">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">نام و نام خانوادگی</label>
        <input type="text" name="name" class="form-control" placeholder="مثلاً علی رضایی" required>
      </div>

      <div class="mb-3">
        <label class="form-label">ایمیل</label>
        <input type="email" name="email" class="form-control" placeholder="example@gmail.com" required>
      </div>

      <div class="mb-3">
        <label class="form-label">موضوع پیام</label>
        <input type="text" name="subject" class="form-control" placeholder="موضوع پیام شما" required>
      </div>

      <div class="mb-3">
        <label class="form-label">متن پیام</label>
        <textarea name="text" rows="4" class="form-control" placeholder="متن پیام خود را بنویسید..." required></textarea>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">ارسال پیام ✉️</button>
    </form>

    <div class="text-center mt-4">
      <small class="text-muted">یا از طریق ایمیل با ما در ارتباط باشید:  
        <a href="mailto:support@example.com" class="text-decoration-none">support@example.com</a>
      </small>
      {% if messages %}
        {% for message in messages %}
          <div class="alert alert-success" role="alert">{{ message }}</div>
        {% endfor %}
      {% endif %}
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
