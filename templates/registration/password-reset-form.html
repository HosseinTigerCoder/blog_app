<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه ورود</title>

    <!-- Bootstrap RTL -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #f0f4ff, #e6e9ff);
            height: 100vh;
            display: flex;
            justify-content: center; /* افقی وسط */
            align-items: center;     /* عمودی وسط */
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            background: #fff;
            border: none;
            border-radius: 1.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            padding: 2rem;
        }
        .btn-primary {
            background-color: #4c6ef5;
            border: none;
        }
        .btn-primary:hover {
            background-color: #3b5bdb;
        }
    </style>
</head>
<body>

<div class="login-card">
    <h4 class="text-center mb-4 fw-bold">ورود به حساب کاربری</h4>

    <form method="post" novalidate>
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit" class="btn btn-primary w-100 py-2">ورود</button>

        {% if messages %}
            <div class="mt-3">
                {% for message in messages %}
                    <div class="alert alert-info text-center py-2">{{ message }}</div>
                {% endfor %}
            </div>
        {% endif %}
    </form>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
